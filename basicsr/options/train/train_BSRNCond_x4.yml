# general settings
name: BSRNCond_finetune_fullmodel
model_type: BSRNCondModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
      name: SyntheticDiv2k
      type: SyntheticDegradationDataset

      dataroot_gt: datasets/DIV2K_valid_HR

      io_backend:
        type: disk
      
      gt_size: 256

      blur_range: [0.2, 1.5]
      noise_range: [0, 10]
      jpeg_range: [60, 100]
      skip: 0.1

      use_hflip: true
      use_rot: true

      use_shuffle: true
      num_worker_per_gpu: 3
      batch_size_per_gpu: 16
      dataset_enlarge_ratio: 100
      prefetch_mode: ~
#   train:
#     name: DF2K
#     type: PairedImageDataset
# #    dataroot_gt: /mnt/yxsun/Project/Data/datasets/DIV2K/DIV2K_train_HR_sub
# #    dataroot_lq: /mnt/yxsun/Project/Data/datasets/DIV2K/DIV2K_train_LR_bicubic/X4_sub
# #    (for lmdb)
#     dataroot_gt: ./datasets/DF2K/DF2K_HR_sub.lmdb
#     dataroot_lq: ./datasets/DF2K/DF2K_train_LR_bicubic_X4_sub.lmdb
#     filename_tmpl: '{}'
#     io_backend:
#       type: lmdb
#       # (for lmdb)
#       # type: lmdb

#     gt_size: 192
#     use_hflip: true
#     use_rot: true

#     # data loader
#     use_shuffle: true
#     num_worker_per_gpu: 3
#     batch_size_per_gpu: 32
#     dataset_enlarge_ratio: 100
#     prefetch_mode: ~

  val:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set5/GTmod4
    dataroot_lq: ./datasets/Set5/LRbicx4
    io_backend:
      type: disk

# network structures
network_g:
  type: BSRNCond
  num_in_ch: 3
  num_feat: 64
  num_block: 8
  num_out_ch: 3
  upscale: 4
  degradation_dim: 4
  embed_dim: 32

# path
path:
  pretrain_network_g: basicsr/net_g_BSRN_x4.pth
  param_key_g: params
  strict_load_g: false

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000]
    restart_weights: [1]
    eta_min: !!float 1e-7


  total_iter: 20000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv1_2': 0.1
      'conv2_2': 0.1
      'conv3_4': 1.0
      'conv4_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 0.1
    style_weight: 0
    criterion: l1

# validation settings
val:
  val_freq: !!float 1e5
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
    entity: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
