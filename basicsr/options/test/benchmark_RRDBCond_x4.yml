name: test_RRDBCond_x4_18feat-3block-9grow_200iter
suffix: ~  # add suffix to saved images
model_type: RRDBCondModel
scale: 4
crop_border: ~  # crop border when evaluation. If None, crop the scale pixels
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  # train:
  #   name: SyntheticDiv2k
  #   type: SyntheticDegradationDataset

  #   dataroot_gt: datasets/DIV2K_valid_HR

  #   io_backend:
  #     type: disk
    
  #   gt_size: 256

  #   blur_range: [0.2, 1.5]
  #   noise_range: [0, 10]
  #   jpeg_range: [60, 95]

  #   use_hflip: true
  #   use_rot: true

  test_1: # the 1st test dataset
    name: Set5Random
    type: SyntheticDegradationDataset
    dataroot_gt: ./datasets/Set5/GTmod4
    # dataroot_lq: ./datasets/Set5/LRbicx4
    io_backend:
      type: disk
    blur_range: [0.2, 1.5]
    noise_range: [0, 10]
    jpeg_range: [60, 95]
    gt_size: 228
  test_2: # the 2st test dataset
    name: Set14Random
    type: SyntheticDegradationDataset
    dataroot_gt: ./datasets/Set14/GTmod4
    # dataroot_lq: ./datasets/Set14/LRbicx4
    io_backend:
      type: disk
    blur_range: [0.2, 1.5]
    noise_range: [0, 10]
    jpeg_range: [60, 95]
    gt_size: 228

  test_3:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set5/GTmod4
    dataroot_lq: ./datasets/Set5/LRbicx4
    io_backend:
      type: disk

  test_4:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: ./datasets/Set14/GTmod4
    dataroot_lq: ./datasets/Set14/LRbicx4
    io_backend:
      type: disk

  # test_5:
  #   name: Manga109
  #   type: PairedImageDataset
  #   dataroot_gt: ./datasets/Manga109/GTmod4
  #   dataroot_lq: ./datasets/Manga109/LRbicx4
  #   io_backend:
  #     type: disk


# network structures
network_g:
  type: RRDBNetCond
  num_in_ch: 3
  num_feat: 18
  num_block: 3
  num_grow_ch: 9
  num_out_ch: 3
  # upscale: 4
  # degradation_dim: 4
  # embed_dim: 32
  # change_c: 15
  # conv: BSConvU

  # upsampler: pixelshuffledirect
  # p: 0.25

# path
path:
  pretrain_network_g: models/rrdb-200-4x-18feat-3block-9grow-3xpixel-1xlpips-50xfft-freqDegradationHead.pth
  strict_load_g: false
  param_key_g: ~

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
